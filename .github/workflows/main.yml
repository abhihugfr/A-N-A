
name: LoveRing Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LoveRing APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager missing"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Find Or Extract LoveRing Project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find . -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not extracted."
            echo "Searching ZIP files..."

            FOUND=0

            while IFS= read -r -d '' ZIPFILE; do
              if unzip -Z1 "$ZIPFILE" | \
                grep -Eq '(^|/)settings.gradle(\.kts)?$'; then

                echo "Extracting: $ZIPFILE"
                mkdir -p _lovering_src
                unzip -q "$ZIPFILE" -d _lovering_src
                FOUND=1
                break
              fi
            done < <(find . -maxdepth 5 -type f \
              -iname '*.zip' \
              -not -path './.git/*' \
              -print0)

            if [ "$FOUND" -eq 0 ]; then
              echo "ERROR: No LoveRing ZIP found."
              echo "Upload lovering-ultimate-project.zip to repository."
              exit 1
            fi
          fi

          SETTINGS=$(find . -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file missing after extraction"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: App Gradle file missing"
            exit 1
          fi

          echo "Project found: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --version

      - name: Build LoveRing APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Find Generated APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          echo "APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload LoveRing APK
        uses: actions/upload-artifact@v4
        with:
          name: LoveRing-APK
          path: ${{ steps.project.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          
