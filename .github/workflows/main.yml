
name: LoveRing Android APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LoveRing APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Android SDK tools found"

      - name: Accept Android Licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      - name: Install Android SDK Packages
        run: |
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Project Files
        run: |
          test -f gradlew
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/src/main/AndroidManifest.xml
          echo "All required project files found"

      - name: Grant Gradle Permission
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Check APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload LoveRing APK
        uses: actions/upload-artifact@v4
        with:
          name: LoveRing-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
